<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat Soal Otomatis SD - Kurikulum Merdeka & K13</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Print Styles */
        body {
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* Print Media Styling for Clean PDF / Paper Print */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-break {
                page-break-before: always;
            }
            .avoid-break {
                page-break-inside: avoid;
            }
            .paper-shadow {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        }

        .paper-sheet {
            background: #ffffff;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="antialiased">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Main App Component
function App() {
    // API Key State (disimpan di Local Storage agar tidak perlu diisi berulang)
    const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "AQ.Ab8RN6Kew74JDIOjhZamLFwRQPPQDBF8zT5YrUzX6oKLvija7g");
    const [showApiKey, setShowApiKey] = useState(false);

    // Configuration Form State
    const [kelas, setKelas] = useState("Kelas 4");
    const [mataPelajaran, setMataPelajaran] = useState("IPAS (IPA & IPS)");
    const [topik, setTopik] = useState("Daur Hidup Hewan dan Metamorfosis");
    const [tipeGrup, setTipeGrup] = useState("tunggal"); // 'tunggal' | 'stimulus' (TKA/AKM)
    const [generateImage, setGenerateImage] = useState(true);
    const [sekolah, setSekolah] = useState("SD Negeri Nusantara 01");
    const [semester, setSemester] = useState("Ganjil");
    const [waktu, setWaktu] = useState("60 Menit");

    // Question Type Configurations
    const [questionConfigs, setQuestionConfigs] = useState({
        pg_biasa: { enabled: true, count: 5, level: "C2 (Memahami)" },
        pg_kompleks: { enabled: true, count: 2, level: "C4 (Menganalisis)" },
        menjodohkan: { enabled: true, count: 2, level: "C3 (Menerapkan)" },
        benar_salah: { enabled: true, count: 3, level: "C2 (Memahami)" },
        isian: { enabled: true, count: 3, level: "C1 (Mengingat)" },
        esai: { enabled: true, count: 2, level: "C5 (Mengevaluasi)" }
    });

    // App State
    const [isLoading, setIsLoading] = useState(false);
    const [loadingStage, setLoadingStage] = useState("");
    const [activeTab, setActiveTab] = useState("naskah"); // 'naskah' | 'kunci' | 'kisi'
    const [generatedData, setGeneratedData] = useState(null);
    const [toastMessage, setToastMessage] = useState(null);
    const [isEditingHeader, setIsEditingHeader] = useState(false);

    // Subject Presets
    const subjects = [
        "IPAS (IPA & IPS)",
        "Matematika",
        "Bahasa Indonesia",
        "Pendidikan Pancasila",
        "Bahasa Inggris",
        "PJOK",
        "Seni Budaya dan Prakarya (SBdP)"
    ];

    const cLevels = [
        "C1 (Mengingat)",
        "C2 (Memahami)",
        "C3 (Menerapkan)",
        "C4 (Menganalisis)",
        "C5 (Mengevaluasi)",
        "C6 (Mencipta)"
    ];

    const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
    };

    const handleQuestionConfigChange = (type, key, value) => {
        setQuestionConfigs(prev => ({
            ...prev,
            [type]: {
                ...prev[type],
                [key]: value
            }
        }));
    };

    // Gemini API Helper with Exponential Backoff
    async function callGeminiApi(url, payload, maxRetries = 3) {
        let attempt = 0;
        let delay = 1000;
        while (attempt < maxRetries) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    return await response.json();
                } else {
                    console.warn(`Attempt ${attempt + 1} failed with status: ${response.status}`);
                }
            } catch (error) {
                console.warn(`Attempt ${attempt + 1} error:`, error);
            }
            attempt++;
            if (attempt < maxRetries) {
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }
        throw new Error("Gagal terhubung dengan layanan AI setelah beberapa kali percobaan.");
    }

    const handleGenerate = async () => {
        const enabledTypes = Object.entries(questionConfigs).filter(([_, config]) => config.enabled);
        
        if (enabledTypes.length === 0) {
            showToast("⚠️ Pilih setidaknya satu jenis soal!");
            return;
        }

        if (!topik.trim()) {
            showToast("⚠️ Masukkan topik atau materi spesifik!");
            return;
        }

        setIsLoading(true);
        setLoadingStage("Menyiapkan draf soal & kisi-kisi berbasis Bloom's Taxonomy...");

        try {
            // Build Prompt details
            const typeRequirements = enabledTypes.map(([type, cfg]) => {
                const names = {
                    pg_biasa: "Pilihan Ganda Biasa (4 opsi A,B,C,D)",
                    pg_kompleks: "Pilihan Ganda Kompleks (Pilihan jawaban lebih dari satu yang benar)",
                    menjodohkan: "Menjodohkan (Pasangan pernyataan Kiri dan Kanan)",
                    benar_salah: "Benar / Salah (Pernyataan dengan opsi Benar atau Salah)",
                    isian: "Uraian Singkat / Isian",
                    esai: "Uraian Panjang / Esai"
                };
                return `- ${names[type]}: ${cfg.count} butir (Level Target: ${cfg.level})`;
            }).join("\n");

            const systemPrompt = `Anda adalah seorang Pakar Kurikulum dan Pengembang Soal Sekolah Dasar (SD) profesional di Indonesia. 
Buatkan paket soal ujian lengkap untuk siswa SD yang ramah anak, jelas, kontekstual, dan sesuai standar Kurikulum Merdeka / K13.

Gunakan bahasa Indonesia baku yang sesuai untuk siswa SD ${kelas}.
Pastikan soal mencakup:
1. Naskah Soal lengkap
2. Kunci Jawaban terpisah beserta penjelasan/pembahasannya
3. Kisi-kisi Soal lengkap dengan Tujuan Pembelajaran (TP), Indikator Soal, dan Level Kognitif (C1-C6).

Mode Soal: ${tipeGrup === 'stimulus' ? 'Berbasis Stimulus/TKA (Sediakan 1-2 bacaan/teks/infografis singkat sebagai acuan beberapa soal)' : 'Soal Mandiri/Tunggal'}.`;

            const userQuery = `Buatkan paket soal SD dengan ketentuan:
- Sekolah: ${sekolah}
- Kelas: ${kelas}
- Mata Pelajaran: ${mataPelajaran}
- Topik / Materi: ${topik}
- Semester: ${semester}
- Alokasi Waktu: ${waktu}

Spesifikasi Jumlah & Tipe Soal:
${typeRequirements}

Sertakan deskripsi prompt gambar bahasa Inggris yang detail pada properti "image_prompt" apabila soal atau stimulus tersebut sangat cocok dilengkapi ilustrasi visual (seperti gambar hewan, diagram, grafik, atau situasi).`;

            if (!apiKey || !apiKey.trim()) {
                showToast("⚠️ Harap masukkan API Key Gemini Anda!");
                setIsLoading(false);
                return;
            }

            const activeApiKey = apiKey.trim();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeApiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            header: {
                                type: "OBJECT",
                                properties: {
                                    sekolah: { type: "STRING" },
                                    mataPelajaran: { type: "STRING" },
                                    kelas: { type: "STRING" },
                                    semester: { type: "STRING" },
                                    topik: { type: "STRING" },
                                    alokasiWaktu: { type: "STRING" }
                                },
                                required: ["sekolah", "mataPelajaran", "kelas", "topik"]
                            },
                            stimulus_list: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        id: { type: "STRING" },
                                        title: { type: "STRING" },
                                        text: { type: "STRING" },
                                        image_prompt: { type: "STRING" }
                                    },
                                    required: ["id", "title", "text"]
                                }
                            },
                            questions: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        id: { type: "NUMBER" },
                                        stimulus_id: { type: "STRING" },
                                        type: { type: "STRING", description: "pg_biasa | pg_kompleks | menjodohkan | benar_salah | isian | esai" },
                                        c_level: { type: "STRING", description: "C1, C2, C3, C4, C5, atau C6" },
                                        question_text: { type: "STRING" },
                                        options: {
                                            type: "ARRAY",
                                            items: { type: "STRING" }
                                        },
                                        matching_pairs: {
                                            type: "ARRAY",
                                            items: {
                                                type: "OBJECT",
                                                properties: {
                                                    left: { type: "STRING" },
                                                    right: { type: "STRING" }
                                                }
                                            }
                                        },
                                        statements: {
                                            type: "ARRAY",
                                            items: {
                                                type: "OBJECT",
                                                properties: {
                                                    statement: { type: "STRING" },
                                                    is_correct: { type: "BOOLEAN" }
                                                }
                                            }
                                        },
                                        correct_answer: { type: "STRING" },
                                        explanation: { type: "STRING" },
                                        indicator: { type: "STRING" },
                                        image_prompt: { type: "STRING" }
                                    },
                                    required: ["id", "type", "c_level", "question_text", "correct_answer", "explanation", "indicator"]
                                }
                            },
                            kisi_kisi: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        no: { type: "NUMBER" },
                                        tujuan_pembelajaran: { type: "STRING" },
                                        materi: { type: "STRING" },
                                        indikator_soal: { type: "STRING" },
                                        level_kognitif: { type: "STRING" },
                                        bentuk_soal: { type: "STRING" },
                                        nomor_soal: { type: "NUMBER" }
                                    },
                                    required: ["no", "tujuan_pembelajaran", "materi", "indikator_soal", "level_kognitif", "bentuk_soal", "nomor_soal"]
                                }
                            }
                        },
                        required: ["header", "questions", "kisi_kisi"]
                    }
                }
            };

            const data = await callGeminiApi(apiUrl, payload);
            const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!rawJson) {
                throw new Error("Gagal mengolah respons dari model AI.");
            }

            let parsedData = JSON.parse(rawJson);

            // Generate Image Illustrations if toggled
            if (generateImage) {
                setLoadingStage("Menggenerasi gambar ilustrasi untuk soal...");

                // Items requiring illustration (questions or stimulus with image_prompt)
                let itemsWithPrompts = [];

                if (parsedData.stimulus_list) {
                    parsedData.stimulus_list.forEach((stim, idx) => {
                        if (stim.image_prompt) {
                            itemsWithPrompts.push({ type: 'stimulus', index: idx, prompt: stim.image_prompt });
                        }
                    });
                }

                parsedData.questions.forEach((q, idx) => {
                    // Generate image for first 3 questions or any question with a clear image prompt
                    if (q.image_prompt && itemsWithPrompts.length < 4) {
                        itemsWithPrompts.push({ type: 'question', index: idx, prompt: q.image_prompt });
                    }
                });

                // Fetch images sequentially or in small parallel batches
                for (let i = 0; i < itemsWithPrompts.length; i++) {
                    const target = itemsWithPrompts[i];
                    setLoadingStage(`Menggambar ilustrasi ${i + 1} dari ${itemsWithPrompts.length}...`);

                    try {
                        const imgUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${activeApiKey}`;
                        const imgPayload = {
                            contents: [{
                                parts: [{ text: `Simple vector black and white or clean colored educational illustration for elementary school worksheet about: ${target.prompt}. White background, clear line art.` }]
                            }],
                            generationConfig: {
                                responseModalities: ['IMAGE']
                            }
                        };

                        const imgData = await callGeminiApi(imgUrl, imgPayload);
                        const base64Str = imgData?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                        if (base64Str) {
                            const fullImgSrc = `data:image/png;base64,${base64Str}`;
                            if (target.type === 'stimulus') {
                                parsedData.stimulus_list[target.index].generated_image = fullImgSrc;
                            } else {
                                parsedData.questions[target.index].generated_image = fullImgSrc;
                            }
                        }
                    } catch (e) {
                        console.warn("Gagal membuat ilustrasi untuk item ini:", e);
                    }
                }
            }

            setGeneratedData(parsedData);
            showToast("✨ Berhasil membuat paket soal lengkap!");
        } catch (err) {
            console.error(err);
            showToast("❌ Terjadi kesalahan: " + err.message);
        } finally {
            setIsLoading(false);
        }
    };

    // Export to MS Word (.doc HTML format)
    const handleExportWord = () => {
        if (!generatedData) return;

        const contentHtml = document.getElementById('exportable-content').innerHTML;

        const headerDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' 
        xmlns:w='urn:schemas-microsoft-com:office:word' 
        xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Naskah Soal SD</title>
        <style>
            body { font-family: 'Calibri', 'Arial', sans-serif; font-size: 11pt; line-height: 1.4; color: #000; }
            table { border-collapse: collapse; width: 100%; margin-bottom: 12pt; }
            th, td { border: 1px solid #333; padding: 6pt; text-align: left; font-size: 10pt; }
            th { background-color: #f2f2f2; font-weight: bold; }
            .header-table td { border: none !important; padding: 2pt; }
            .badge { border: 1px solid #888; padding: 2px 5px; font-size: 8pt; border-radius: 3px; }
            h1, h2, h3 { color: #111; }
            .q-block { margin-bottom: 14pt; page-break-inside: avoid; }
            .stimulus-box { border: 1px solid #aaa; background-color: #f9f9f9; padding: 10pt; margin-bottom: 12pt; }
        </style>
        </head><body>`;

        const footerDoc = "</body></html>";
        const sourceHTML = headerDoc + contentHtml + footerDoc;

        const blob = new Blob(['\ufeff' + sourceHTML], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Soal_${generatedData.header.mataPelajaran.replace(/[^a-zA-Z0-0]/g, '_')}_${generatedData.header.kelas}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("📥 Berhasil mengunduh dokumen MS Word!");
    };

    // Print or Save as PDF using Native Browser Print
    const handlePrintPDF = () => {
        window.print();
    };

    return (
        <div class="min-h-screen flex flex-col font-sans">
            {/* Header Navbar */}
            <header class="bg-gradient-to-r from-sky-700 via-sky-800 to-indigo-900 text-white shadow-md no-print sticky top-0 z-30">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm">
                            <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
                        </div>
                        <div>
                            <h1 class="text-lg sm:text-xl font-bold tracking-tight">Pembuat Soal Otomatis SD</h1>
                            <p class="text-xs text-sky-200">Kurikulum Merdeka & K13 • Generator Soal & Kisi-Kisi AI</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <span class="hidden md:inline-flex items-center bg-sky-600/50 text-sky-100 text-xs px-3 py-1 rounded-full border border-sky-400/30">
                            <i class="fa-solid fa-sparkles text-amber-300 mr-1.5"></i> Gemini 3 Flash & Nano Flash Image
                        </span>
                    </div>
                </div>
            </header>

            {/* Toast Notification */}
            {toastMessage && (
                <div class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all animate-bounce">
                    <span>{toastMessage}</span>
                </div>
            )}

            {/* Main Container */}
            <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* Left Column: Generator Configurations */}
                <div class="lg:col-span-5 space-y-6 no-print">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
                        
                        <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                            <h2 class="text-base font-bold text-slate-800 flex items-center">
                                <i class="fa-solid fa-sliders text-sky-600 mr-2"></i> Parameter Soal SD
                            </h2>
                            <span class="text-xs bg-sky-50 text-sky-700 px-2.5 py-1 rounded-md font-medium border border-sky-100">
                                Step 1/2
                            </span>
                        </div>

                        {/* API Key Input Box */}
                        <div class="bg-amber-50/70 border border-amber-200 rounded-xl p-3 space-y-1.5">
                            <div class="flex items-center justify-between">
                                <label class="text-xs font-semibold text-amber-900 flex items-center">
                                    <i class="fa-solid fa-key text-amber-600 mr-1.5"></i> Google Gemini API Key
                                </label>
                                <button 
                                    type="button"
                                    onClick={() => setShowApiKey(!showApiKey)}
                                    class="text-[10px] font-medium text-amber-700 hover:underline focus:outline-none"
                                >
                                    {showApiKey ? "Sembunyikan" : "Lihat Key"}
                                </button>
                            </div>
                            <input 
                                type={showApiKey ? "text" : "password"}
                                value={apiKey}
                                onChange={(e) => {
                                    setApiKey(e.target.value);
                                    localStorage.setItem("gemini_api_key", e.target.value);
                                }}
                                placeholder="Masukkan API Key Gemini Anda di sini..."
                                class="w-full text-xs font-mono bg-white border border-amber-300 rounded-lg p-2 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <p class="text-[10px] text-amber-800/80">API Key akan tersimpan otomatis di penyimpanan lokal browser Anda.</p>
                        </div>

                        {/* Class & Subject Inputs */}
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas SD</label>
                                <select 
                                    value={kelas} 
                                    onChange={(e) => setKelas(e.target.value)}
                                    class="w-full text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none"
                                >
                                    {["Kelas 1", "Kelas 2", "Kelas 3", "Kelas 4", "Kelas 5", "Kelas 6"].map(k => (
                                        <option key={k} value={k}>{k}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
                                <select 
                                    value={mataPelajaran} 
                                    onChange={(e) => setMataPelajaran(e.target.value)}
                                    class="w-full text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none"
                                >
                                    {subjects.map(s => (
                                        <option key={s} value={s}>{s}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        {/* Topic Input */}
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Topik / Materi Spesifik</label>
                            <input 
                                type="text"
                                value={topik}
                                onChange={(e) => setTopik(e.target.value)}
                                placeholder="Contoh: Daur Hidup Hewan / Operasi Pecahan Desimal"
                                class="w-full text-xs bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none"
                            />
                        </div>

                        {/* Model Soal & Image Toggles */}
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Model Struktur Soal</label>
                                <select 
                                    value={tipeGrup} 
                                    onChange={(e) => setTipeGrup(e.target.value)}
                                    class="w-full text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sky-500 outline-none"
                                >
                                    <option value="tunggal">Soal Standar / Tunggal</option>
                                    <option value="stimulus">Grup TKA / AKM (Ada Bacaan/Teks)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Ilustrasi Gambar AI</label>
                                <label class="flex items-center space-x-2 bg-slate-50 border border-slate-300 rounded-lg p-2 cursor-pointer hover:bg-slate-100 text-xs">
                                    <input 
                                        type="checkbox" 
                                        checked={generateImage}
                                        onChange={(e) => setGenerateImage(e.target.checked)}
                                        class="rounded text-sky-600 focus:ring-sky-500 h-4 w-4"
                                    />
                                    <span class="text-slate-700 font-medium">Buat Gambar AI</span>
                                </label>
                            </div>
                        </div>

                        {/* Header Details Collapsible */}
                        <div class="border-t border-slate-100 pt-3">
                            <button 
                                onClick={() => setIsEditingHeader(!isEditingHeader)}
                                class="text-xs font-medium text-sky-700 flex items-center hover:underline focus:outline-none"
                            >
                                <i class={`fa-solid fa-chevron-${isEditingHeader ? 'up' : 'down'} text-[10px] mr-1.5`}></i>
                                {isEditingHeader ? "Sembunyikan Identitas Sekolah" : "Atur Identitas Ujian & Sekolah"}
                            </button>

                            {isEditingHeader && (
                                <div class="mt-3 grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <div class="col-span-3">
                                        <label class="block text-[10px] text-slate-500">Nama Sekolah</label>
                                        <input 
                                            type="text" 
                                            value={sekolah} 
                                            onChange={(e) => setSekolah(e.target.value)}
                                            class="w-full text-xs p-1.5 bg-white border border-slate-300 rounded"
                                        />
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-slate-500">Semester</label>
                                        <input 
                                            type="text" 
                                            value={semester} 
                                            onChange={(e) => setSemester(e.target.value)}
                                            class="w-full text-xs p-1.5 bg-white border border-slate-300 rounded"
                                        />
                                    </div>
                                    <div class="col-span-2">
                                        <label class="block text-[10px] text-slate-500">Alokasi Waktu</label>
                                        <input 
                                            type="text" 
                                            value={waktu} 
                                            onChange={(e) => setWaktu(e.target.value)}
                                            class="w-full text-xs p-1.5 bg-white border border-slate-300 rounded"
                                        />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Question Types Config Card */}
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                            <h2 class="text-base font-bold text-slate-800 flex items-center">
                                <i class="fa-solid fa-list-check text-sky-600 mr-2"></i> Bentuk & Butir Soal
                            </h2>
                            <span class="text-xs text-slate-500">Konfigurasi Bloom C1-C6</span>
                        </div>

                        <div class="space-y-3">
                            {[
                                { key: "pg_biasa", label: "Pilihan Ganda Biasa", icon: "fa-regular fa-circle-dot" },
                                { key: "pg_kompleks", label: "Pilihan Ganda Kompleks", icon: "fa-regular fa-square-check" },
                                { key: "menjodohkan", label: "Menjodohkan", icon: "fa-solid fa-diagram-project" },
                                { key: "benar_salah", label: "Benar / Salah", icon: "fa-solid fa-toggle-on" },
                                { key: "isian", label: "Isian Singkat", icon: "fa-solid fa-pen-line" },
                                { key: "esai", label: "Uraian / Esai", icon: "fa-solid fa-align-left" },
                            ].map((item) => {
                                const cfg = questionConfigs[item.key];
                                return (
                                    <div key={item.key} class={`p-3 rounded-xl border transition-all ${cfg.enabled ? 'border-sky-200 bg-sky-50/40' : 'border-slate-200 bg-slate-50/50 opacity-60'}`}>
                                        <div class="flex items-center justify-between mb-2">
                                            <label class="flex items-center space-x-2 cursor-pointer font-medium text-xs text-slate-800">
                                                <input 
                                                    type="checkbox" 
                                                    checked={cfg.enabled}
                                                    onChange={(e) => handleQuestionConfigChange(item.key, 'enabled', e.target.checked)}
                                                    class="rounded text-sky-600 focus:ring-sky-500 h-4 w-4"
                                                />
                                                <span><i class={`${item.icon} text-sky-600 mr-1.5`}></i>{item.label}</span>
                                            </label>

                                            {cfg.enabled && (
                                                <div class="flex items-center space-x-1">
                                                    <span class="text-[10px] text-slate-500">Jumlah:</span>
                                                    <input 
                                                        type="number" 
                                                        min="1" 
                                                        max="15" 
                                                        value={cfg.count}
                                                        onChange={(e) => handleQuestionConfigChange(item.key, 'count', parseInt(e.target.value) || 1)}
                                                        class="w-12 text-center text-xs font-bold border border-slate-300 rounded p-1 bg-white"
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        {cfg.enabled && (
                                            <div class="mt-2 flex items-center justify-between text-xs">
                                                <span class="text-[10px] text-slate-500">Level Target:</span>
                                                <select 
                                                    value={cfg.level}
                                                    onChange={(e) => handleQuestionConfigChange(item.key, 'level', e.target.value)}
                                                    class="text-[11px] bg-white border border-slate-200 rounded px-2 py-1 text-slate-700 outline-none"
                                                >
                                                    {cLevels.map(lvl => (
                                                        <option key={lvl} value={lvl}>{lvl}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Generate Button */}
                        <button 
                            onClick={handleGenerate}
                            disabled={isLoading}
                            class="w-full mt-4 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-sky-500/20 flex items-center justify-center space-x-2 transition-all disabled:opacity-50"
                        >
                            {isLoading ? (
                                <>
                                    <i class="fa-solid fa-spinner fa-spin text-lg"></i>
                                    <span class="text-sm">Memproses AI...</span>
                                </>
                            ) : (
                                <>
                                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-base"></i>
                                    <span class="text-sm">Generate Paket Soal & Kisi-Kisi</span>
                                </>
                            )}
                        </button>
                    </div>
                </div>

                {/* Right Column: Generated Preview & Output Tabs */}
                <div class="lg:col-span-7">
                    
                    {/* Action Toolbar */}
                    {generatedData && (
                        <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm mb-4 flex flex-wrap items-center justify-between gap-3 no-print">
                            {/* Navigation Tabs */}
                            <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-slate-600">
                                <button 
                                    onClick={() => setActiveTab("naskah")}
                                    class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === "naskah" ? 'bg-white text-sky-700 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    <i class="fa-solid fa-file-pen mr-1.5"></i> Naskah Soal
                                </button>
                                <button 
                                    onClick={() => setActiveTab("kunci")}
                                    class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === "kunci" ? 'bg-white text-sky-700 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    <i class="fa-solid fa-key mr-1.5"></i> Kunci Jawaban
                                </button>
                                <button 
                                    onClick={() => setActiveTab("kisi")}
                                    class={`px-3 py-1.5 rounded-lg transition-all ${activeTab === "kisi" ? 'bg-white text-sky-700 shadow-sm' : 'hover:text-slate-900'}`}
                                >
                                    <i class="fa-solid fa-table-list mr-1.5"></i> Kisi-Kisi Soal
                                </button>
                            </div>

                            {/* Export Buttons */}
                            <div class="flex items-center space-x-2">
                                <button 
                                    onClick={handleExportWord}
                                    class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-lg flex items-center shadow-sm transition-all"
                                    title="Unduh file dokumen Word"
                                >
                                    <i class="fa-solid fa-file-word mr-1.5"></i> Download Word
                                </button>
                                <button 
                                    onClick={handlePrintPDF}
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-lg flex items-center shadow-sm transition-all"
                                    title="Cetak atau Simpan sebagai PDF"
                                >
                                    <i class="fa-solid fa-print mr-1.5"></i> Cetak / PDF
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Loading Overlay State */}
                    {isLoading && (
                        <div class="paper-sheet p-12 text-center flex flex-col items-center justify-center space-y-4 my-8 min-h-[400px]">
                            <div class="relative">
                                <div class="w-16 h-16 border-4 border-sky-200 border-t-sky-600 rounded-full animate-spin"></div>
                                <i class="fa-solid fa-book-open text-sky-600 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>
                            </div>
                            <div class="space-y-1">
                                <h3 class="text-base font-bold text-slate-800">Sedang Menyusun Soal Otomatis</h3>
                                <p class="text-xs text-sky-600 animate-pulse font-medium">{loadingStage}</p>
                            </div>
                            <p class="text-[11px] text-slate-400 max-w-xs">AI sedang merancang soal HOTS/LOTS, indikator kisi-kisi, dan menggambar visual pendukung.</p>
                        </div>
                    )}

                    {/* Empty State */}
                    {!isLoading && !generatedData && (
                        <div class="paper-sheet p-12 text-center flex flex-col items-center justify-center space-y-4 min-h-[450px]">
                            <div class="w-20 h-20 bg-sky-50 rounded-full flex items-center justify-center text-sky-600 text-3xl">
                                <i class="fa-solid fa-file-circle-plus"></i>
                            </div>
                            <div class="space-y-1 max-w-sm">
                                <h3 class="text-base font-bold text-slate-800">Belum Ada Soal Tergenerasi</h3>
                                <p class="text-xs text-slate-500">Pilih kelas, mata pelajaran, dan tentukan jumlah butir soal pada panel sebelah kiri, lalu klik tombol **Generate Paket Soal**.</p>
                            </div>
                            <div class="flex items-center space-x-2 text-[11px] text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border">
                                <i class="fa-solid fa-circle-check text-emerald-500"></i>
                                <span>Mendukung PG, PG Kompleks, Menjodohkan, B/S, Isian & Esai</span>
                            </div>
                        </div>
                    )}

                    {/* Output View Container */}
                    {!isLoading && generatedData && (
                        <div id="exportable-content" class="paper-sheet p-6 sm:p-10 space-y-6 text-slate-900">
                            
                            {/* Standard Header Document Kop Surat Ujian */}
                            <div class="border-b-2 border-slate-900 pb-4 text-center space-y-1">
                                <h2 class="text-base sm:text-lg font-bold uppercase tracking-wide">{generatedData.header.sekolah}</h2>
                                <h3 class="text-sm font-semibold text-slate-700">PENILAIAN HARIAN / ASESMEN SUMATIF KURIKULUM MERDEKA</h3>
                                <div class="grid grid-cols-2 text-xs text-left pt-3 border-t border-slate-200 mt-2 gap-y-1">
                                    <div><span class="font-semibold">Mata Pelajaran:</span> {generatedData.header.mataPelajaran}</div>
                                    <div><span class="font-semibold">Kelas / Semester:</span> {generatedData.header.kelas} / {generatedData.header.semester}</div>
                                    <div><span class="font-semibold">Topik / Materi:</span> {generatedData.header.topik}</div>
                                    <div><span class="font-semibold">Alokasi Waktu:</span> {generatedData.header.alokasiWaktu}</div>
                                </div>
                            </div>

                            {/* TAB 1: NASKAH SOAL */}
                            {activeTab === "naskah" && (
                                <div class="space-y-6">
                                    {/* Stimulus Section if TKA/AKM */}
                                    {generatedData.stimulus_list && generatedData.stimulus_list.length > 0 && (
                                        <div class="space-y-4">
                                            {generatedData.stimulus_list.map((stim, i) => (
                                                <div key={i} class="stimulus-box bg-slate-50 border border-slate-300 p-4 rounded-xl space-y-2">
                                                    <span class="text-[10px] font-bold uppercase text-sky-700 bg-sky-100 px-2 py-0.5 rounded">
                                                        STIMULUS BACAAN {i + 1}
                                                    </span>
                                                    <h4 class="text-sm font-bold text-slate-800">{stim.title}</h4>
                                                    
                                                    {stim.generated_image && (
                                                        <div class="my-2 flex justify-center">
                                                            <img 
                                                                src={stim.generated_image} 
                                                                alt="Ilustrasi Stimulus" 
                                                                class="max-h-52 object-contain rounded border bg-white p-1"
                                                            />
                                                        </div>
                                                    )}

                                                    <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">{stim.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* Render Questions List */}
                                    <div class="space-y-6">
                                        {generatedData.questions.map((q, idx) => (
                                            <div key={idx} class="q-block text-xs leading-relaxed space-y-2 border-b border-slate-100 pb-4 last:border-none">
                                                <div class="flex items-start justify-between">
                                                    <div class="flex items-center space-x-2">
                                                        <span class="font-bold text-sm">{idx + 1}.</span>
                                                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium border border-slate-200">
                                                            {q.type === 'pg_biasa' && 'Pilihan Ganda'}
                                                            {q.type === 'pg_kompleks' && 'PG Kompleks'}
                                                            {q.type === 'menjodohkan' && 'Menjodohkan'}
                                                            {q.type === 'benar_salah' && 'Benar / Salah'}
                                                            {q.type === 'isian' && 'Isian Singkat'}
                                                            {q.type === 'esai' && 'Uraian / Esai'}
                                                        </span>
                                                    </div>
                                                    <span class="text-[10px] bg-sky-50 text-sky-700 px-2 py-0.5 rounded font-semibold border border-sky-200">
                                                        {q.c_level}
                                                    </span>
                                                </div>

                                                {/* Question Text */}
                                                <p class="text-slate-800 font-medium pl-5">{q.question_text}</p>

                                                {/* Question Image if present */}
                                                {q.generated_image && (
                                                    <div class="pl-5 my-2">
                                                        <img 
                                                            src={q.generated_image} 
                                                            alt={`Ilustrasi Soal ${idx + 1}`} 
                                                            class="max-h-48 object-contain rounded border bg-white p-1"
                                                        />
                                                    </div>
                                                )}

                                                {/* Render PG Biasa */}
                                                {q.type === 'pg_biasa' && q.options && (
                                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pl-5 pt-1">
                                                        {q.options.map((opt, oIdx) => (
                                                            <div key={oIdx} class="text-slate-700">
                                                                {opt}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Render PG Kompleks */}
                                                {q.type === 'pg_kompleks' && q.options && (
                                                    <div class="space-y-1 pl-5 pt-1">
                                                        <p class="text-[11px] text-slate-500 italic mb-1">(Pilih lebih dari satu jawaban yang benar)</p>
                                                        {q.options.map((opt, oIdx) => (
                                                            <div key={oIdx} class="flex items-center space-x-2">
                                                                <input type="checkbox" disabled class="rounded text-slate-400" />
                                                                <span>{opt}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Render Menjodohkan */}
                                                {q.type === 'menjodohkan' && q.matching_pairs && (
                                                    <div class="pl-5 pt-1">
                                                        <table class="w-full text-xs border border-slate-300 rounded">
                                                            <thead>
                                                                <tr class="bg-slate-100">
                                                                    <th class="border p-1.5 text-left w-1/2">Pernyataan A</th>
                                                                    <th class="border p-1.5 text-left w-1/2">Pasangan B</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {q.matching_pairs.map((pair, pIdx) => (
                                                                    <tr key={pIdx}>
                                                                        <td class="border p-1.5">{pair.left}</td>
                                                                        <td class="border p-1.5 text-slate-400">.............................. ({pair.right})</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                                {/* Render Benar / Salah */}
                                                {q.type === 'benar_salah' && q.statements && (
                                                    <div class="pl-5 pt-1">
                                                        <table class="w-full text-xs border border-slate-300">
                                                            <thead>
                                                                <tr class="bg-slate-100">
                                                                    <th class="border p-1.5 text-left">Pernyataan</th>
                                                                    <th class="border p-1.5 text-center w-16">Benar</th>
                                                                    <th class="border p-1.5 text-center w-16">Salah</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {q.statements.map((stmt, sIdx) => (
                                                                    <tr key={sIdx}>
                                                                        <td class="border p-1.5">{stmt.statement}</td>
                                                                        <td class="border p-1.5 text-center"><div class="w-4 h-4 border border-slate-400 mx-auto rounded"></div></td>
                                                                        <td class="border p-1.5 text-center"><div class="w-4 h-4 border border-slate-400 mx-auto rounded"></div></td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                                {/* Render Isian Singkat */}
                                                {q.type === 'isian' && (
                                                    <div class="pl-5 pt-2">
                                                        <div class="border-b border-dotted border-slate-400 w-3/4 h-6"></div>
                                                    </div>
                                                )}

                                                {/* Render Esai */}
                                                {q.type === 'esai' && (
                                                    <div class="pl-5 pt-2 space-y-2">
                                                        <div class="border-b border-dotted border-slate-300 w-full h-4"></div>
                                                        <div class="border-b border-dotted border-slate-300 w-full h-4"></div>
                                                        <div class="border-b border-dotted border-slate-300 w-full h-4"></div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB 2: KUNCI JAWABAN & PEMBAHASAN */}
                            {activeTab === "kunci" && (
                                <div class="space-y-4">
                                    <h3 class="text-sm font-bold border-b pb-2 uppercase text-sky-800 flex items-center">
                                        <i class="fa-solid fa-key mr-2"></i> Kunci Jawaban & Pembahasan
                                    </h3>

                                    <div class="space-y-4 text-xs">
                                        {generatedData.questions.map((q, idx) => (
                                            <div key={idx} class="bg-slate-50 border border-slate-200 p-3 rounded-lg space-y-1.5">
                                                <div class="flex items-center justify-between">
                                                    <span class="font-bold text-slate-800">Soal No. {idx + 1} ({q.c_level})</span>
                                                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">
                                                        Kunci Jawaban
                                                    </span>
                                                </div>
                                                
                                                <p class="font-bold text-emerald-700 bg-white p-2 rounded border border-emerald-200">
                                                    Jawaban: {q.correct_answer}
                                                </p>

                                                <div class="text-slate-600 bg-white p-2 rounded border border-slate-200 text-[11px] leading-relaxed">
                                                    <span class="font-semibold text-slate-800">Pembahasan: </span>
                                                    {q.explanation}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: KISI-KISI SOAL */}
                            {activeTab === "kisi" && (
                                <div class="space-y-4">
                                    <h3 class="text-sm font-bold border-b pb-2 uppercase text-sky-800 flex items-center">
                                        <i class="fa-solid fa-table-list mr-2"></i> Kisi-Kisi Penyusunan Soal
                                    </h3>

                                    <div class="overflow-x-auto">
                                        <table class="w-full text-[11px] border-collapse border border-slate-300">
                                            <thead>
                                                <tr class="bg-slate-100 text-slate-800 font-bold">
                                                    <th class="border border-slate-300 p-2 text-center w-8">No</th>
                                                    <th class="border border-slate-300 p-2 text-left">Tujuan Pembelajaran</th>
                                                    <th class="border border-slate-300 p-2 text-left">Materi</th>
                                                    <th class="border border-slate-300 p-2 text-left">Indikator Soal</th>
                                                    <th class="border border-slate-300 p-2 text-center w-16">Level</th>
                                                    <th class="border border-slate-300 p-2 text-center w-24">Bentuk</th>
                                                    <th class="border border-slate-300 p-2 text-center w-12">No. Soal</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {generatedData.kisi_kisi.map((row, rIdx) => (
                                                    <tr key={rIdx} class="hover:bg-slate-50">
                                                        <td class="border border-slate-300 p-2 text-center font-semibold">{row.no}</td>
                                                        <td class="border border-slate-300 p-2">{row.tujuan_pembelajaran}</td>
                                                        <td class="border border-slate-300 p-2">{row.materi}</td>
                                                        <td class="border border-slate-300 p-2">{row.indikator_soal}</td>
                                                        <td class="border border-slate-300 p-2 text-center font-bold text-sky-700">{row.level_kognitif}</td>
                                                        <td class="border border-slate-300 p-2 text-center">{row.bentuk_soal}</td>
                                                        <td class="border border-slate-300 p-2 text-center font-bold">{row.nomor_soal}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </div>
                    )}
                </div>

            </div>

            {/* Footer */}
            <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print mt-auto">
                <div class="max-w-7xl mx-auto px-4">
                    <p>Aplikasi Pembuat Soal SD Otomatis • Mendukung Kurikulum Merdeka & Kurikulum 2013</p>
                </div>
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
